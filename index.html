<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>StockView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --plane:#e3e9f3; --plane-2:#d7dfee; --card:#ffffff; --card-2:#f4f7fc;
  --line:#d9e1ee; --line-soft:#e8edf6;
  --ink:#101a2c; --ink-2:#4e5b73; --ink-3:#8691a8;
  --deep:#13264a; --deep-2:#1e4a8f; --deep-3:#2a5aa8;
  --on-deep:#eaf1ff; --on-deep-2:#9fb6dd;
  --brand-red:#d5202a; --brand-blue:#1d3f78; --accent:#1d4ed8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#5598e7; --seq4:#2a78d6; --seq5:#184f95;
  --gd-ink:#0d2a4d;
  --age1:#fde6c0; --age2:#f8c877; --age3:#eda100; --age4:#c07806; --age5:#8a5304;
  --shadow:0 1px 2px rgba(19,38,74,.05), 0 14px 32px -20px rgba(19,38,74,.35);
  --glow:radial-gradient(900px 420px at 18% -10%, rgba(42,120,214,.16), transparent 65%),
         radial-gradient(760px 380px at 95% 0%, rgba(213,32,42,.09), transparent 62%);
  --sans:'IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --plane:#080e18; --plane-2:#0b1422; --card:#111a29; --card-2:#0d1523;
    --line:#212d42; --line-soft:#19222f;
    --ink:#e9eef7; --ink-2:#9fadc4; --ink-3:#6c7a92;
    --deep:#0a1830; --deep-2:#16325f; --deep-3:#2a5aa8;
    --on-deep:#eaf1ff; --on-deep-2:#9fb6dd;
    --brand-red:#ef4b52; --brand-blue:#4f83e0; --accent:#6ea3f0;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --seq1:#184f95; --seq2:#256abf; --seq3:#3987e5; --seq4:#6da7ec; --seq5:#9ec5f4;
    --gd-ink:#ffffff;
    --age1:#5a3603; --age2:#8a5304; --age3:#c07806; --age4:#eda100; --age5:#f8c877;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.9);
    --glow:radial-gradient(900px 420px at 18% -10%, rgba(42,120,214,.20), transparent 65%),
           radial-gradient(760px 380px at 95% 0%, rgba(213,32,42,.10), transparent 62%);
  }
}
:root[data-theme="dark"]{
    --plane:#080e18; --plane-2:#0b1422; --card:#111a29; --card-2:#0d1523;
  --line:#212d42; --line-soft:#19222f;
  --ink:#e9eef7; --ink-2:#9fadc4; --ink-3:#6c7a92;
  --deep:#0a1830; --deep-2:#16325f; --deep-3:#2a5aa8;
  --on-deep:#eaf1ff; --on-deep-2:#9fb6dd;
  --brand-red:#ef4b52; --brand-blue:#4f83e0; --accent:#6ea3f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --seq1:#184f95; --seq2:#256abf; --seq3:#3987e5; --seq4:#6da7ec; --seq5:#9ec5f4;
  --gd-ink:#ffffff;
  --age1:#5a3603; --age2:#8a5304; --age3:#c07806; --age4:#eda100; --age5:#f8c877;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.9);
  --glow:radial-gradient(900px 420px at 18% -10%, rgba(42,120,214,.20), transparent 65%),
         radial-gradient(760px 380px at 95% 0%, rgba(213,32,42,.10), transparent 62%);
}
*{box-sizing:border-box}
body{background:var(--plane);background-image:var(--glow);background-repeat:no-repeat;
     background-attachment:fixed;color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- ตราร้าน ---------- */
.mark{display:inline-flex;border-radius:9px;overflow:hidden;flex:none;
      font-weight:700;letter-spacing:.5px;color:#fff;line-height:1}
.mark span{display:grid;place-items:center}
.mark .a{background:var(--brand-red)}
.mark .b{background:var(--brand-blue)}
.top .mark .b,.gate .mark .b{background:#3576d8}
.gate .mark{box-shadow:0 0 0 7px rgba(255,255,255,.10),0 16px 34px -18px rgba(0,0,0,.8)}
.mark.lg{font-size:34px}.mark.lg span{width:64px;height:64px}
.mark.sm{font-size:15px;border-radius:7px}.mark.sm span{width:30px;height:30px}

/* ---------- หน้าแรก ---------- */
.gate{position:relative;isolation:isolate;overflow:hidden;min-height:86svh;
      background:linear-gradient(145deg,var(--deep) 0%,var(--deep-2) 58%,var(--deep-3) 100%);
      display:grid;place-items:center;padding-block:clamp(46px,9vw,86px)}
.gate::before{content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(620px 320px at 12% 8%, rgba(213,32,42,.34), transparent 60%),
             radial-gradient(760px 420px at 88% 96%, rgba(58,138,231,.30), transparent 62%)}
.gate::after{content:'';position:absolute;inset:0;z-index:-1;opacity:.14;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 1px,transparent 1px 13px)}
.gate-in{width:100%;max-width:820px;margin:0 auto;padding-inline:20px;text-align:center;
         display:grid;gap:22px;justify-items:center;color:var(--on-deep)}
.gate h1{font-size:clamp(30px,5.4vw,48px);margin:0;letter-spacing:-.8px;
         text-wrap:balance;font-weight:700;color:#fff}
.gate .sub{color:var(--on-deep-2);max-width:46ch;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;
         color:var(--on-deep-2);font-weight:600;font-family:var(--mono)}
.teaser{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.teaser div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
            border-radius:14px;padding:16px 12px;display:grid;gap:3px;
            backdrop-filter:blur(6px)}
.teaser b{font-family:var(--mono);font-size:clamp(18px,2.8vw,25px);font-weight:600;
          letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:#fff}
.teaser small{color:var(--on-deep-2);font-size:11.5px}
.enter{background:#fff;color:var(--deep);border:0;border-radius:12px;
       padding:14px 34px;font-weight:700;font-size:15px;cursor:pointer;
       box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.enter:hover{transform:translateY(-1px)}
.gate-note{color:var(--on-deep-2);font-size:12px;max-width:54ch;opacity:.85}
@media (max-width:560px){.teaser{grid-template-columns:repeat(2,1fr)}}

/* ---------- โครงแดชบอร์ด ---------- */
.wrap{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:0 44px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
     background:linear-gradient(120deg,var(--deep),var(--deep-2));
     padding-block:12px;margin-bottom:22px;color:var(--on-deep);
     box-shadow:0 10px 26px -20px rgba(10,24,48,.9)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandline{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.brandline b{font-size:15px;font-weight:600;white-space:nowrap;color:#fff}
.brandline em{font-style:normal;color:var(--on-deep-2);font-size:12px;white-space:nowrap}
.spacer{flex:1 1 auto}
.navsel{appearance:none;background:rgba(255,255,255,.12);color:#fff;
        border:1px solid rgba(255,255,255,.22);
        border-radius:10px;padding:9px 34px 9px 13px;font-weight:600;cursor:pointer;
        background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                         linear-gradient(135deg,currentColor 50%,transparent 50%);
        background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
        background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.navsel option{color:var(--ink);background:var(--card)}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
         border-radius:10px;color:#fff;
         width:38px;height:38px;cursor:pointer;display:grid;place-items:center;font-size:15px}
.iconbtn:hover{background:rgba(255,255,255,.2)}

h2.view-t{font-size:20px;margin:0 0 2px;font-weight:700;letter-spacing:-.2px}
p.view-s{margin:0 0 18px;color:var(--ink-2);font-size:13px}

.grid{display:grid;gap:14px;align-items:start}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.c2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c2,.c2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.teaser{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:17px;box-shadow:var(--shadow)}
.kpi-card{background:linear-gradient(170deg,var(--card),var(--card-2))}
.card>header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card>header h3{font-size:14.5px;margin:0;font-weight:600}
.card>header .hint{color:var(--ink-3);font-size:11.5px;margin-left:auto;font-family:var(--mono)}

.kpi{display:grid;gap:8px}
.kpi .lab{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:7px}
.kpi .num{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.8px;
          font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .foot{color:var(--ink-3);font-size:11.5px}
.dotm{width:9px;height:9px;border-radius:50%;flex:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
      padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);
      background:var(--card-2)}
.chip.demo{border-color:var(--warn);color:var(--ink);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.gbadge{margin-right:2px;font-family:var(--mono);font-weight:600;font-size:11px;width:20px;height:20px;
        border-radius:6px;display:inline-grid;place-items:center;color:#fff}
.gA{background:var(--seq5)}.gB{background:var(--seq4)}.gC{background:var(--seq3)}
.gD{background:var(--seq2);color:var(--gd-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}

svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--line-soft)}
.axis{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono)}
.axis.mid{fill:var(--ink-2)}

table{width:100%;border-collapse:collapse;font-size:13px}
.tbox{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:11.5px;letter-spacing:.3px;
   padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
   position:sticky;top:0;background:var(--card-2);cursor:pointer;user-select:none}
th.no{cursor:default}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{min-width:210px;max-width:380px}
td.nm b{font-weight:500}
td.nm small{display:block;color:var(--ink-3);font-family:var(--mono);font-size:11px}
tbody tr:hover{background:var(--card-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{background:var(--card);border:1px solid var(--line);
       border-radius:9px;padding:8px 11px}
.filters input{flex:1 1 210px;min-width:0}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;
       margin-top:10px;color:var(--ink-2);font-size:12.5px}
.pager button{background:var(--card);border:1px solid var(--line);border-radius:8px;
              padding:6px 12px;cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:default}

.bar-row{display:grid;grid-template-columns:52px 1fr 92px;gap:10px;align-items:center;
         padding:5px 0;font-size:12.5px}
.bar-row .g{font-family:var(--mono);color:var(--ink-2)}
.bar-track{background:var(--line-soft);border-radius:4px;height:12px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-row .v{font-family:var(--mono);text-align:right;color:var(--ink-2);
            font-variant-numeric:tabular-nums}

.tip{position:fixed;pointer-events:none;z-index:60;background:var(--card);
     border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;
     box-shadow:var(--shadow);opacity:0;transition:opacity .12s;max-width:260px}
.tip b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.foot{color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.7;
      border-top:1px solid var(--line);padding-top:14px}



/* ---------- ส่วนที่เพิ่มสำหรับรุ่นสองภาษา ---------- */
.langpill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
          color:#fff;border-radius:999px;padding:7px 18px;font-size:12.5px;font-weight:600;
          cursor:pointer;letter-spacing:.3px}
.langpill:hover{background:rgba(255,255,255,.2)}
.chip.onDeep{border-color:rgba(255,255,255,.38);color:#fff;background:rgba(255,255,255,.14)}
.metarow{display:flex;flex-wrap:wrap;gap:10px 22px;margin:-6px 0 16px;
         padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.metarow span{font-size:12.5px;color:var(--ink);display:flex;gap:7px;align-items:baseline}
.metarow em{font-style:normal;color:var(--ink-3);font-size:11px;letter-spacing:.4px;
            text-transform:uppercase;font-family:var(--mono)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
      white-space:nowrap}
.p-match{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-short{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.p-over{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.p-todo{background:var(--line-soft);color:var(--ink-3)}
.statusbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line-soft)}
.statusbar div{height:100%}
.netbar{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;
        padding:10px 14px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
.netbar.off{background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:var(--warn)}
.netbar.on{background:color-mix(in srgb,var(--good) 12%,transparent);border-color:var(--good)}
.mini{color:var(--ink-3);font-size:11.5px;margin:10px 0 0}
.muted3{color:var(--ink-3)}
.empty2{padding:26px;text-align:center;color:var(--ink-3)}
td.sn{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
span.u{color:var(--ink-3)}
th.r{text-align:right}
/* ---------- ส่วนที่ใช้งานได้จริง ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 14px;
     font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--deep-2);border-color:var(--deep-2);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.card>header{flex-wrap:wrap}
input.cellnum{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
   background:var(--card-2);font-family:var(--mono);text-align:right;font-size:13px;
   font-variant-numeric:tabular-nums}
input.cellnum:focus{background:var(--card);border-color:var(--accent)}
td.act{width:36px;text-align:center}
.rowdel{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:13px;
   width:26px;height:26px;border-radius:7px}
.rowdel:hover{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.docform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.docform label{display:grid;gap:5px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
   color:var(--ink-3);font-family:var(--mono);min-width:0}
.docform input{background:var(--card);border:1px solid var(--line);border-radius:10px;
   padding:9px 11px;font-size:13.5px;font-family:var(--sans);color:var(--ink);
   min-width:0;width:100%;box-sizing:border-box}
@media (max-width:760px){.docform{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:430px){.docform{grid-template-columns:1fr}}
.scanbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
   margin-bottom:14px;box-shadow:var(--shadow)}
.scanbox label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px}
.scanrow{display:flex;gap:9px}
.scanrow input{flex:1 1 auto;min-width:0;background:var(--card-2);border:1px solid var(--line);
   border-radius:10px;padding:11px 13px;font-size:15px;font-family:var(--mono)}
.scanrow input:focus{background:var(--card);border-color:var(--accent)}
.alertbox{margin-top:10px;background:color-mix(in srgb,var(--crit) 12%,transparent);
   color:var(--crit);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
.modal{position:fixed;inset:0;z-index:80;background:rgba(9,16,30,.55);
   display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.modal .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
   width:min(560px,100%);max-height:78vh;display:flex;flex-direction:column;padding:16px;
   box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal header h3{margin:0;font-size:15px}
.iconbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);
   margin-left:auto;width:32px;height:32px}
.modal input{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
   padding:10px 12px;font-size:14px;color:var(--ink)}
.pklist{overflow:auto;margin-top:10px;display:grid;gap:2px}
.pklist button{display:grid;gap:2px;text-align:left;background:transparent;border:0;
   border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.pklist button:hover{background:var(--card-2)}
.pklist button b{font-weight:500;font-size:13.5px}
.pklist button span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pklist button.dupe{opacity:.55}
.pklist button.dupe:disabled{cursor:not-allowed}
.pklist button.dupe:disabled:hover{background:transparent}
.hav{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.04em;
   text-transform:uppercase;color:var(--good);border:1px solid var(--good);
   border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
   background:var(--deep);color:#fff;border-radius:999px;padding:11px 22px;font-size:13px;
   font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
   box-shadow:0 18px 40px -18px rgba(0,0,0,.8);max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;
   background:var(--card-2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.dropin{display:grid;gap:8px;justify-items:center}
.dropin b{font-size:15px}
.dropin .mini{max-width:52ch;margin:0}
.helpbox{font-size:13px;color:var(--ink-2)}
.helpbox b{color:var(--ink)}
.helpbox ol{margin:8px 0 0;padding-left:20px;display:grid;gap:5px}
.alertcard{border-color:var(--crit);color:var(--crit);font-weight:600;font-size:13px}
/* ---------- ล็อกอินแอดมิน ---------- */
.signin{margin-top:14px;max-width:460px}
.signin h3{margin:0 0 4px;font-size:15px}
.signin>.mini:first-of-type{margin-top:0}
.signin>.mini:last-child{margin-top:14px;line-height:1.6}
.signin #adMsg:not(:empty){margin-top:10px}
.lockbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
   border-radius:10px;color:#fff;height:38px;padding:0 13px;cursor:pointer;
   display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lockbtn:hover{background:rgba(255,255,255,.2)}
.lockbtn.on{background:color-mix(in srgb,#0ca30c 42%,transparent);border-color:#3fd23f}

/* ---------- กล้องยิงบาร์โค้ด ---------- */
.modal.cam{padding:0;place-items:stretch}
.camsheet{background:var(--card);display:flex;flex-direction:column;width:100%;height:100%;
   padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));gap:10px}
.camsheet header{display:flex;align-items:center;gap:10px;flex:none;
   padding-top:env(safe-area-inset-top,0px)}
.camsheet header h3{margin:0;font-size:15px}
.camstage{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;
   background:#05080f;display:grid;place-items:center}
#camVid{width:100%;height:100%;object-fit:cover;display:block}
.cam.nolive .camstage{display:none}
.cam.nolive .camsheet{height:auto;margin:auto;border-radius:16px;
   width:min(560px,100%);max-height:90vh}
.cam.nolive{place-items:center;padding:20px}
.camframe{position:absolute;inset:14% 8%;border-radius:12px;pointer-events:none;
   box-shadow:0 0 0 100vmax rgba(5,8,15,.45);border:2px solid rgba(255,255,255,.85)}
.camframe i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff4d4d;
   box-shadow:0 0 10px rgba(255,77,77,.9);animation:camscan 1.9s ease-in-out infinite}
@keyframes camscan{0%{top:14%}50%{top:86%}100%{top:14%}}
@media (prefers-reduced-motion:reduce){.camframe i{animation:none;top:50%}}
.camstat{margin:0;font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;flex:none}
.camstat.bad{color:var(--crit)}
.camrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;flex:none}
.camrow .btn{cursor:pointer}
.camchk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
@media (min-width:760px){
  .modal.cam{place-items:center;padding:20px}
  .camsheet{width:min(560px,100%);height:min(720px,90vh);border:1px solid var(--line);
     border-radius:16px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
}

const loc = () => (L === 'th' ? 'th-TH' : 'en-US');

const money = n => new Intl.NumberFormat(loc(),{maximumFractionDigits:0}).format(n);
const compact = n => n >= 1e6 ? (n/1e6).toFixed(2).replace(/\.00$/,'') + (L==='th'?' ล้าน':'M')
                   : n >= 1e3 ? Math.round(n/1e3) + 'K' : String(Math.round(n));

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };

/* ---------- svg ---------- */
const NS = 'http://www.w3.org/2000/svg';
function svg(vb){ const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox',vb);
  s.setAttribute('class','chart'); s.setAttribute('preserveAspectRatio','xMidYMid meet'); return s; }
function add(p,tag,at,txt){ const n=document.createElementNS(NS,tag);
  for(const k in at) n.setAttribute(k,at[k]); if(txt!==undefined) n.textContent=txt;
  p.appendChild(n); return n; }

function card(title, hint, body){
  const c = el('div','card'); const h = el('header');
  h.appendChild(el('h3',null,esc(title)));
  if (hint) h.appendChild(el('div','hint',esc(hint)));
  c.appendChild(h); c.appendChild(body); return c;
}
function kpi(lab, num, foot, colorVar){
  const c = el('div','card kpi-card'), k = el('div','kpi');
  k.appendChild(el('div','lab','<i class="dotm" style="background:'+css(colorVar)+'"></i>'+esc(lab)));
  k.appendChild(el('div','num', num));
  k.appendChild(el('div','foot', esc(foot)));
  c.appendChild(k); return c;
}
function metaRow(pairs){
  const d = el('div','metarow');

  return d;
}
function pill(kind, label){
  return '<span class="pill p-'+kind+'">'+esc(label)+'</span>';
}

/* ---------- charts ---------- */
function trendChart(){
  const W=720,H=240,Lm=60,R=16,T=16,B=30, s=svg('0 0 '+W+' '+H);
  const pts=CAT.trend, vals=pts.map(p=>p[1]);
  const lo=Math.min(...vals)*.965, hi=Math.max(...vals)*1.02;
  const x=i=>Lm+i*(W-Lm-R)/(pts.length-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s1=css('--s1');
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v);
    add(s,'line',{x1:Lm,x2:W-R,y1:yy,y2:yy,class:'gridline','stroke-width':1});
    add(s,'text',{x:Lm-9,y:yy+3.5,class:'axis','text-anchor':'end'},compact(v)); }
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const defs=add(s,'defs',{}), lg=add(defs,'linearGradient',{id:'gt',x1:0,y1:0,x2:0,y2:1});
  add(lg,'stop',{offset:'0%','stop-color':s1,'stop-opacity':.28});
  add(lg,'stop',{offset:'100%','stop-color':s1,'stop-opacity':0});
  add(s,'path',{d:d+' L'+x(pts.length-1)+' '+(H-B)+' L'+Lm+' '+(H-B)+' Z',fill:'url(#gt)',stroke:'none'});
  add(s,'path',{d:d,fill:'none',stroke:s1,'stroke-width':2,'stroke-linejoin':'round'});
  const MON_EN=['Mar','Apr','May','Jun','Jul','Aug','Sep'];
  pts.forEach((p,i)=>{ const last=i===pts.length-1;
    add(s,'circle',{cx:x(i),cy:y(p[1]),r:last?5:3.4,fill:last?s1:css('--card'),stroke:s1,'stroke-width':2});
    add(s,'text',{x:x(i),y:H-9,class:'axis','text-anchor':'middle'}, L==='th'?p[0]:MON_EN[i]);
    const hit=add(s,'circle',{cx:x(i),cy:y(p[1]),r:16,fill:'transparent'});
    hit.style.cursor='crosshair';
    hit.addEventListener('mousemove',e=>showTip(e,'<div style="color:var(--ink-2)">'+
      esc(L==='th'?p[0]:MON_EN[i])+' 2026</div><b>'+money(p[1])+' '+t().baht+'</b>'));
    hit.addEventListener('mouseleave',hideTip); });
  return s;
}
function gradeDonut(){
  const W=300,H=214,cx=150,cy=108,r=82,w=26, s=svg('0 0 '+W+' '+H);
  const tot=CAT.grades.reduce((a,g)=>a+g.val,0);
  const cols=['--seq5','--seq4','--seq3','--seq2'];
  let ang=-Math.PI/2;
  CAT.grades.forEach((g,i)=>{

function paretoChart(){

  const items=CAT.items, tot=CAT.meta.totalValue, N=120, step=(W-Lm-R)/N;
  const maxV=items[0].v, y=v=>T+(1-v/maxV)*(H-T-B), yc=f=>T+(1-f)*(H-T-B);

    add(s,'line',{x1:Lm,x2:W-R,y1:yy,y2:yy,class:'gridline','stroke-width':1});
    add(s,'text',{x:W-R+8,y:yy+3.5,class:'axis'},Math.round(f*100)+'%'); }
  let cum=0; const cp=[];
  for(let i=0;i<N;i++){ const it=items[i];
    const h=Math.max(1,(H-T-B)-(y(it.v)-T));

    b.addEventListener('mouseleave',hideTip);
    cum+=it.v; cp.push([Lm+i*step+step/2, yc(cum/tot)]); }
  add(s,'path',{d:cp.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),
                fill:'none',stroke:s2,'stroke-width':2,'stroke-linejoin':'round'});

let ST={q:'',g:'',grp:'',age:'',sort:'v',dir:-1,page:0};
const PAGE=40;
function bucketOf(d){ return d<=30?0:d<=90?1:d<=180?2:d<=365?3:4; }
function vItems(){
  const T_=t(), root=el('div');
  root.appendChild(el('h2','view-t',esc(T_.nav.items)));
  root.appendChild(el('p','view-s',esc(T_.it_sub_a+' '+nf(CAT.meta.skuWithStock)+' '+T_.it_sub_b)));
  const f=el('div','filters');
  f.innerHTML='<input id="fq" type="search" placeholder="'+esc(T_.f_search)+'" value="'+esc(ST.q)+'">'+
    '<select id="fg"><option value="">'+esc(T_.f_allg)+'</option>'+
      ['A','B','C','D'].map(g=>'<option value="'+g+'">'+esc(T_.f_grade)+' '+g+'</option>').join('')+'</select>'+
    '<select id="fgrp"><option value="">'+esc(T_.f_allgrp)+'</option>'+
      CAT.groups.map(g=>'<option value="'+esc(g.g)+'">'+esc(tx(g,'g'))+'</option>').join('')+'</select>'+
    '<select id="fage"><option value="">'+esc(T_.f_allage)+'</option>'+
      T_.buckets.map((l,i)=>'<option value="'+i+'">'+esc(l)+'</option>').join('')+'</select>';
  root.appendChild(f);
  const box=el('div','tbox'); box.id='itemBox'; root.appendChild(box);
  const pg=el('div','pager'); pg.id='itemPager'; root.appendChild(pg);
  setTimeout(()=>{ const fq=$('#fq'),fg=$('#fg'),fgrp=$('#fgrp'),fage=$('#fage');
    if(!fq) return;
    fg.value=ST.g; fgrp.value=ST.grp; fage.value=ST.age;
    const on=()=>{ST.q=fq.value;ST.g=fg.value;ST.grp=fgrp.value;ST.age=fage.value;ST.page=0;renderItems();};
    fq.addEventListener('input',on); [fg,fgrp,fage].forEach(x=>x.addEventListener('change',on));
    renderItems(); },0);
  return root;
}
function filtered(){
  const q=ST.q.trim().toLowerCase();
  return CAT.items.filter(r=>{
    if(ST.g&&r.G!==ST.g) return false;
    if(ST.grp&&r.g!==ST.grp) return false;
    if(ST.age!==''&&bucketOf(r.d)!==+ST.age) return false;
    if(q&&((r.n+' '+r.ne+' '+r.c+' '+r.l+' '+r.le).toLowerCase().indexOf(q)===-1)) return false;
    return true;
  }).sort((a,b)=>{ const k=ST.sort;
    const av=(k==='n')?tx(a,'n'):(k==='l')?tx(a,'l'):a[k];
    const bv=(k==='n')?tx(b,'n'):(k==='l')?tx(b,'l'):b[k];
    if(typeof av==='string') return ST.dir*String(av).localeCompare(String(bv),loc());
    return ST.dir*(av-bv); });
}
function renderItems(){
  const T_=t(), box=$('#itemBox'); if(!box) return;
  const rows=filtered(), start=ST.page*PAGE, slice=rows.slice(start,start+PAGE);
  const tb=el('table');
  const cols=[['n',T_.th_item,'left'],['l',T_.th_shelf,'left'],['q',T_.th_qty,'right'],
              ['p',T_.th_cost,'right'],['v',T_.th_value,'right'],['d',T_.th_age,'right'],
              ['G',T_.th_grade,'left']];
  const th=el('thead');
  th.innerHTML='<tr>'+cols.map(c=>'<th data-k="'+c[0]+'" style="text-align:'+c[2]+'">'+esc(c[1])+
    (ST.sort===c[0]?(ST.dir<0?' ↓':' ↑'):'')+'</th>').join('')+'</tr>';
  tb.appendChild(th);
  const body=el('tbody');
  if(!slice.length) body.innerHTML='<tr><td colspan="7" class="empty2">'+esc(T_.empty)+'</td></tr>';
  else slice.forEach(r=>{ const tr=el('tr');
    tr.innerHTML='<td class="nm"><b>'+esc(tx(r,'n'))+'</b><small>'+esc(r.c)+'</small></td>'+
      '<td>'+esc(tx(r,'l'))+'</td>'+
      '<td class="num">'+nf(r.q)+' <span class="u">'+esc(tx(r,'u'))+'</span></td>'+
      '<td class="num">'+money(r.p)+'</td>'+
      '<td class="num"><b>'+money(r.v)+'</b></td>'+
      '<td class="num" style="color:'+(r.d>180?'var(--serious)':'var(--ink-2)')+'">'+r.d+' '+T_.day+'</td>'+
      '<td><span class="gbadge g'+r.G+'">'+r.G+'</span></td>';
    body.appendChild(tr); });
  tb.appendChild(body); box.replaceChildren(tb);
  th.querySelectorAll('th').forEach(h=>h.addEventListener('click',()=>{
    const k=h.getAttribute('data-k');
    if(ST.sort===k) ST.dir*=-1; else { ST.sort=k; ST.dir=(k==='n'||k==='l'||k==='G')?1:-1; }
    ST.page=0; renderItems(); }));
  const pgs=Math.max(1,Math.ceil(rows.length/PAGE)), pg=$('#itemPager');
  pg.replaceChildren();
  pg.appendChild(el('span',null,nf(rows.length)+' '+T_.item+' · '+T_.page_+' '+(ST.page+1)+' '+T_.of+' '+nf(pgs)));
  const pv=el('button',null,T_.prev), nx=el('button',null,T_.next);
  pv.disabled=ST.page===0; nx.disabled=ST.page>=pgs-1;
  pv.onclick=()=>{ST.page--;renderItems();scrollTo({top:0,behavior:'smooth'});};
  nx.onclick=()=>{ST.page++;renderItems();scrollTo({top:0,behavior:'smooth'});};

/* ================= catalog: recompute every derived figure ================= */
const COLS = {
  c:['รหัสสินค้า','รหัส','sku','code','itemcode','item code','product code'],
  n:['ชื่อสินค้า(เต็ม)','ชื่อสินค้าเต็ม','ชื่อสินค้า','ชื่อ','name','product','product name','description'],
  q:['จำนวนคงเหลือ','คงเหลือ','จำนวน','qty','quantity','stock','on hand','onhand','balance'],
  u:['หน่วยฐาน','หน่วยนับ','หน่วย','unit','uom','base unit'],
  l:['สถานที่เก็บ','ที่เก็บ','ชั้นเก็บ','ชั้นวาง','location','shelf','bin'],
  p:['ทุนรับหลังสุด','ทุน/หน่วย','ทุนต่อหน่วย','ต้นทุน','ทุน','cost','unit cost','last cost','price'],
  d:['วันที่ค้าง','ค้างกี่วัน','days idle','idle days','days']
};
const norm = s => String(s==null?'':s).replace(/[\s ]/g,'').toLowerCase();
function findCol(head, list){
  const H = head.map(norm);
  for (const w of list){ const i = H.indexOf(norm(w)); if (i !== -1) return i; }
  for (const w of list){ const k = norm(w);
    for (let j=0;j<H.length;j++) if (H[j] && H[j].indexOf(k) !== -1) return j; }
  return -1;
}
function numOf(v){
  const s = String(v==null?'':v).replace(/[, ]/g,'');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function dayOf(code){
  let h = 0; for (let i=0;i<code.length;i++) h = (h*131 + code.charCodeAt(i)) >>> 0;
  const b = h % 1000;
  if (b < 460) return h % 30;
  if (b < 700) return 30 + h % 60;
  if (b < 850) return 90 + h % 90;
  if (b < 950) return 180 + h % 185;
  return 365 + h % 400;
}
function recompute(rows, keepTrend){
  const items = rows.slice().filter(r => r.q > 0 && r.p > 0);
  items.forEach(r => { r.v = Math.round(r.q * r.p * 100) / 100;
                       if (!r.g) r.g = String(r.l||'-').replace(/[0-9]+$/,'').toUpperCase() || '-';
                       if (r.d === undefined || r.d === null) r.d = dayOf(r.c);
                       if (!r.ne) r.ne = r.n; if (!r.ue) r.ue = r.u;
                       if (!r.le) r.le = r.l; if (!r.ge) r.ge = r.g; });
  items.sort((a,b) => b.v - a.v);
  const total = items.reduce((a,b) => a + b.v, 0) || 1;
  let cum = 0;
  items.forEach(r => { cum += r.v; const s = cum/total;
    r.G = s <= .70 ? 'A' : (s <= .90 ? 'B' : (s <= .98 ? 'C' : 'D')); });
  const gm = {};
  items.forEach(r => { const g = gm[r.g] || (gm[r.g] = {g:r.g, ge:r.ge, sku:0, qty:0, val:0});
                       g.sku++; g.qty += r.q; g.val += r.v; });
  const groups = Object.keys(gm).map(k => gm[k]).sort((a,b) => b.val - a.val);
  const gr = {};
  items.forEach(r => { const x = gr[r.G] || (gr[r.G] = {G:r.G, sku:0, val:0, qty:0});
                       x.sku++; x.val += r.v; x.qty += r.q; });
  const grades = ['A','B','C','D'].filter(k => gr[k]).map(k => gr[k]);
  const bk = i => i<=30?0:i<=90?1:i<=180?2:i<=365?3:4;
  const buckets = [0,1,2,3,4].map(i => ({i:i, sku:0, val:0}));
  items.forEach(r => { const b = buckets[bk(r.d)]; b.sku++; b.val += r.v; });
  const cogs = Math.round(total / 3.6 / 1000) * 1000 || 1;
  const meta = { asOf:'', totalValue: Math.round(total*100)/100, skuWithStock: items.length,
                 totalUnits: items.reduce((a,b) => a + b.q, 0),
                 monthsOfCover: Math.round(total / cogs * 100) / 100,
                 catalogSize: rows.length, cogsMonth: cogs, demo: true };
  const f = [.93,.955,.941,.974,.989,.982,1];
  const lab = ['มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
  const trend = keepTrend || f.map((x,i) => [lab[i], Math.round(total*x/1000)*1000]);
  return { meta, items, groups, grades, buckets, trend };
}

/* ================= parsing an uploaded stock file ================= */
function splitCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  const sep = (text.split('\t').length > text.split(',').length) ? '\t' : ',';
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function rowsToItems(table){
  if (!table.length) throw new Error('empty');
  let hi = 0;
  for (let i=0;i<Math.min(8, table.length);i++)
    if (findCol(table[i], COLS.c) !== -1 && findCol(table[i], COLS.q) !== -1){ hi = i; break; }
  const head = table[hi];
  const ic = findCol(head, COLS.c), iq = findCol(head, COLS.q), ip = findCol(head, COLS.p);
  if (ic === -1 || iq === -1) throw new Error('nocol');
  const inm = findCol(head, COLS.n), iu = findCol(head, COLS.u),
        il = findCol(head, COLS.l), id = findCol(head, COLS.d);
  const out = [];
  for (let r = hi+1; r < table.length; r++){
    const row = table[r];
    const code = String(row[ic]==null?'':row[ic]).trim();
    if (!code) continue;
    out.push({ c:code, n:(inm===-1?code:String(row[inm]||'').trim()) || code,
               q:Math.round(numOf(row[iq])), u:(iu===-1?'':String(row[iu]||'').trim()),
               l:(il===-1?'-':String(row[il]||'-').trim()||'-'),
               p:(ip===-1?0:Math.round(numOf(row[ip])*10000)/10000),
               d:(id===-1?null:Math.round(numOf(row[id]))) });
  }
  return out;
}
let xlsxP;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxP) xlsxP = new Promise((res, rej) => {
    const s = document.createElement('script');
    const to = setTimeout(() => { xlsxP = null; s.remove(); rej(new Error('slow')); }, 20000);
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => { clearTimeout(to); res(window.XLSX); };
    s.onerror = () => { clearTimeout(to); xlsxP = null; rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
  return xlsxP;
}
function readFile(file){
  return new Promise((res, rej) => {
    const name = (file.name||'').toLowerCase();
    if (/\.(xlsx|xlsm|xls)$/.test(name)){
      loadXlsx().then(X => {
        const fr = new FileReader();
        fr.onload = () => { try{
          const wb = X.read(new Uint8Array(fr.result), {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          res(X.utils.sheet_to_json(ws, {header:1, raw:true, defval:''}));
        } catch(e){ rej(e); } };
        fr.onerror = () => rej(new Error('read'));
        fr.readAsArrayBuffer(file);
      }).catch(rej);
    } else {
      const fr = new FileReader();
      fr.onload = () => { try { res(splitCsv(String(fr.result))); } catch(e){ rej(e); } };
      fr.onerror = () => rej(new Error('read'));
      fr.readAsText(file, 'utf-8');
    }
  });
}

function countCalc(r){
  const cnt = (Number(r.f)||0) + (Number(r.w)||0);
  const exp = Number(r.exp)||0, diff = cnt - exp;
  /* ระบบว่า 0 และนับได้ 0 = ครบอยู่แล้ว ไม่มีของให้นับ */
  if (exp===0 && cnt===0) return { cnt, diff:0, st:'match', auto:true };
  return { cnt, diff, st: !r.done ? 'todo' : (diff===0?'match':(diff<0?'short':'over')) };
}

/* ================= receiving check ================= */
function recvCalc(r){
  /* นับของบนชั้นก่อนเก็บของใหม่เข้าไป ดังนั้น "ควรมี" = สต็อกเดิม ไม่ใช่สต็อกเดิม+ของที่รับ */
  const tg=Number(r.op)||0, ct=Number(r.ct)||0;
  const df=ct-tg, af=ct+(Number(r.rc)||0);
  if (tg===0 && ct===0) return { tg, df:0, af, st:'match', auto:true };
  return { tg, df, af, st: !r.done ? 'todo' : (df===0?'match':(df<0?'short':'over')) };
}

function addScan(it, packs){
  const T_=t();
  const cur=DOC.off.rows.find(r=>r.c===it.c);
  if(cur){ cur.packs+=packs; cur.sent=false; }
  else DOC.off.rows.unshift({c:it.c,n:it.n,ne:it.ne,u:it.u,ue:it.ue,
        sn:snOf(it.c),
        mult:1,packs:packs,sent:false});
  saveDoc('off',DOC.off); rerender('offline');
  toast(tx(it,'n').slice(0,28)+' +'+packs);
}

try { ADMIN = localStorage.getItem('sv_admin') === '1'; } catch(e){}

  ADMIN = !!v;

function adminGate(){

/* ================= barcode: live camera + photo fallback ================= */
const BC_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];
/* กรอบ iframe ที่ไม่ได้ใส่สิทธิ์ camera จะบล็อกไว้ตั้งแต่แรก บอกผู้ใช้ให้ตรงสาเหตุ */
function camPolicyBlocked(){
  const fp = document.featurePolicy || document.permissionsPolicy;
  try { if (fp && typeof fp.allowsFeature === 'function') return fp.allowsFeature('camera') === false; }
  catch(e){}
  return false;
}
function inFrame(){ try { return window.top !== window.self; } catch(e){ return true; } }
const camLive = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) &&
                       window.isSecureContext !== false && !camPolicyBlocked();
let camStream=null, camLoop=0, camDet=null, camCb=null, camZX=null, camZXp=null;

function loadZX(){                       /* ตัวถอดบาร์โค้ดสำรอง สำหรับเครื่องที่ไม่มี BarcodeDetector */
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!camZXp) camZXp = new Promise((res,rej)=>{
    const s=document.createElement('script');
    const to=setTimeout(()=>{ camZXp=null; s.remove(); rej(new Error('slow')); }, 20000);
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>{ clearTimeout(to); res(window.ZXing); };
    s.onerror=()=>{ clearTimeout(to); camZXp=null; rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
  return camZXp;
}

function camBuild(){
  let d=document.getElementById('cam');
  if (d) return d;
  d=el('div'); d.id='cam'; d.className='modal cam'; d.setAttribute('role','dialog'); d.hidden=true;
  d.innerHTML =
    '<div class="camsheet">'+
      '<header><h3 id="camTitle"></h3>'+
        '<button class="iconbtn ghost" id="camClose" aria-label="close">✕</button></header>'+
      '<div class="camstage"><video id="camVid" playsinline muted autoplay></video>'+
        '<div class="camframe"><i></i></div></div>'+
      '<p class="camstat" id="camStat"></p>'+
      '<div class="camrow">'+
        '<label class="btn" id="camShotL"><span id="camShotT"></span>'+
          '<input id="camShot" type="file" accept="image/*" capture="environment" hidden></label>'+
      '</div>'+
    '</div>';
  document.body.appendChild(d);
  d.querySelector('#camClose').addEventListener('click', closeCam);
  d.addEventListener('click', e => { if (e.target === d) closeCam(); });
  d.querySelector('#camShot').addEventListener('change', e => {
    const f=e.target.files && e.target.files[0]; e.target.value='';
    if (f) camPhoto(f);
  });
  return d;
}

function camSay(msg, bad){
  const p=document.getElementById('camStat');
  if (p){ p.textContent=msg; p.className='camstat'+(bad?' bad':''); }
}

async function openCam(cb){
  const T_=t();
  camCb=cb;
  const d=camBuild();
  d.querySelector('#camTitle').textContent=T_.cam_title;
  d.querySelector('#camShotT').textContent=T_.cam_photo;
  d.hidden=false;
  camSay(T_.cam_start);
  if (!camLive()){ camSay(T_.cam_nolive, true); d.classList.add('nolive'); return; }
  d.classList.remove('nolive');
  try {
    camStream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  } catch(err){
    let msg = T_.cam_noopen;
    if (err && err.name === 'NotAllowedError') msg = inFrame() ? T_.cam_nolive : T_.cam_denied;
    camSay(msg, true);
    d.classList.add('nolive'); return;
  }
  const v=document.getElementById('camVid');
  v.srcObject=camStream;
  try { await v.play(); } catch(e){}
  camSay(T_.cam_aim);
  /* ตัวอ่าน: ใช้ของในเครื่องก่อน ไม่มีค่อยโหลดตัวสำรอง */
  camDet=null; camZX=null;
  if (window.BarcodeDetector){
    try {
      const ok = await BarcodeDetector.getSupportedFormats();
      camDet = new BarcodeDetector({formats: BC_FORMATS.filter(f=>ok.indexOf(f)!==-1)});
    } catch(e){ camDet=null; }
  }
  if (!camDet){
    try { const Z=await loadZX(); camZX=new Z.BrowserMultiFormatReader(); }
    catch(e){ camSay(T_.cam_nolib, true); }
  }
  camTick();
}

let camBusy=false, camLast='', camLastAt=0;
function camTick(){
  camLoop = requestAnimationFrame(camTick);
  if (camBusy) return;
  const v=document.getElementById('camVid');
  if (!v || v.readyState < 2) return;
  camBusy = true;
  camRead(v).then(code => { camBusy=false; if (code) camHit(code); })
            .catch(() => { camBusy=false; });
}
async function camRead(v){
  if (camDet){
    const r = await camDet.detect(v);
    return r && r.length ? String(r[0].rawValue||'').trim() : '';
  }
  if (camZX){
    const c=document.createElement('canvas');
    c.width=v.videoWidth; c.height=v.videoHeight;
    if (!c.width) return '';
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    try { const r = await camZX.decodeFromCanvas(c); return r ? String(r.getText()||'').trim() : ''; }
    catch(e){ return ''; }
  }
  return '';
}
function camHit(code){
  const now=Date.now();
  if (code===camLast && now-camLastAt < 1400) return;     /* กันยิงซ้ำรัวๆ ตัวเดิม */
  camLast=code; camLastAt=now;
  try { if (navigator.vibrate) navigator.vibrate(60); } catch(e){}
  const cb = camCb;
  closeCam();
  if (cb) cb(code, false);
}
async function camPhoto(file){
  const T_=t();
  camSay(T_.cam_reading);
  let url='';
  try {
    url=URL.createObjectURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    let code='';
    let det=null, rd=null;
    if (window.BarcodeDetector){
      try {
        const ok=await BarcodeDetector.getSupportedFormats();
        const formats=BC_FORMATS.filter(f=>ok.indexOf(f)!==-1);
        det=new BarcodeDetector(formats.length?{formats}:undefined);
        const r=await det.detect(img);
        if (r && r.length) code=String(r[0].rawValue||'').trim();
      } catch(e){}
    }
    if (!code){
      try { const Z=await loadZX(); rd=new Z.BrowserMultiFormatReader(); }
      catch(e){ rd=null; }
    }

    /* กล้องมือถือมักได้ภาพใหญ่มากและบาร์โค้ดอยู่เพียงบางส่วนของภาพ
       จึงย่อและลองอ่านทั้งภาพ/ช่วงกลาง รวมถึงภาพเพิ่มคอนทราสต์ */
    if (!code && (det || rd)){
      const w=img.naturalWidth, h=img.naturalHeight;
      const crops=[
        [0,0,w,h],
        [0,Math.round(h*.18),w,Math.round(h*.64)],
        [Math.round(w*.12),Math.round(h*.12),Math.round(w*.76),Math.round(h*.76)]
      ];
      for(let i=0;i<crops.length && !code;i++){
        const q=crops[i], maxSide=1800;
        const scale=Math.min(1,maxSide/Math.max(q[2],q[3]));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(q[2]*scale));
        c.height=Math.max(1,Math.round(q[3]*scale));
        const cx=c.getContext('2d',{willReadFrequently:true});
        cx.imageSmoothingEnabled=true;
        cx.imageSmoothingQuality='high';
        cx.drawImage(img,q[0],q[1],q[2],q[3],0,0,c.width,c.height);

        if(det){
          try { const r=await det.detect(c); if(r&&r.length) code=String(r[0].rawValue||'').trim(); }
          catch(e){}
        }
        if(!code && rd){
          try { const r=await rd.decodeFromCanvas(c); if(r) code=String(r.getText()||'').trim(); }
          catch(e){}
        }
        if(!code && rd){
          try {
            const px=cx.getImageData(0,0,c.width,c.height), d=px.data;
            for(let p=0;p<d.length;p+=4){
              const y=.299*d[p]+.587*d[p+1]+.114*d[p+2];
              const v=y<145?0:255;
              d[p]=d[p+1]=d[p+2]=v;
            }
            cx.putImageData(px,0,0);
            const r=await rd.decodeFromCanvas(c);
            if(r) code=String(r.getText()||'').trim();
          } catch(e){}
        }
      }
    }
    if (code) camHit(code); else camSay(T_.cam_nocode, true);
  } catch(e){ camSay(T_.cam_nocode, true); }
  finally { if(url) URL.revokeObjectURL(url); }
}
function closeCam(){
  const d=document.getElementById('cam'); if(d) d.hidden=true;
  if (camLoop){ cancelAnimationFrame(camLoop); camLoop=0; }
  if (camZX && camZX.reset){ try{ camZX.reset(); }catch(e){} }
  if (camStream){ camStream.getTracks().forEach(t2=>{ try{t2.stop();}catch(e){} }); camStream=null; }
  const v=document.getElementById('camVid'); if (v) v.srcObject=null;
  camCb=null; camBusy=false; camLast=''; camDet=null; camZX=null;
}

/* ---------- barcode <-> product ---------- */
function snOf(code){
  let h=0; for(let i=0;i<code.length;i++){ h=(h*31+code.charCodeAt(i))|0; }
  return '88'+String(50000000000+Math.abs(h)%49999999999);
}
function findByScan(v){
  const q=String(v||'').trim(); if(!q) return null;
  const lq=q.toLowerCase();
  return CAT.items.find(r=>r.c.toLowerCase()===lq)
      || CAT.items.find(r=>snOf(r.c)===q)
      || CAT.items.find(r=>((r.n||'')+' '+(r.ne||'')).toLowerCase().indexOf(lq)!==-1)
      || null;
}
/* ปุ่มกล้องมาตรฐาน ใช้ได้ทุกหน้าที่มีการยิงบาร์โค้ด */
function camButton(onItem){
  return { label:t().cam_btn, on:()=>openCam((code, keep)=>{
      const it=findByScan(code);
      if (!it){ const m=t().of_notfound+' '+code;
                if (keep) camSay(m, true); else toast(m); return; }
      onItem(it);
    })};
}


const VIEWS={overview:vOverview,grade:vGrade,aging:vAging,items:vItems,
             count:vCount,recv:vRecv,offline:vOffline,update:vUpdate};
const ORDER=['overview','grade','aging','items','count','recv','offline','update'];
let current='overview';
function show(name){
  current=name;
  $('#view').replaceChildren(VIEWS[name]());
  try{ localStorage.setItem('sv_view',name); }catch(e){}
}
function paintChrome(){
  const T_=t();
  $('#mk1').textContent = $('#mk2').textContent = 'ยา';
  $('#brandName').textContent = T_.brand;
  $('#demoChip').textContent = (CAT && CAT.src) ? CAT.src : T_.demo;
  $('#demoChip').classList.toggle('live', !!(CAT && CAT.src));
  $('#g-eyebrow').textContent = T_.eyebrow;
  $('#g-title').textContent = T_.gtitle;
  $('#g-sub').textContent = T_.gsub;
  $('#enterBtn').textContent = T_.enter;
  $('#g-note').textContent = T_.gnote;
  $('#langBtn').textContent = (L==='th' ? 'EN' : 'ไทย');
  const lk=$('#lockBtn');
  lk.textContent = (ADMIN ? '🔓 ' : '🔒 ') + (ADMIN ? T_.lock_out : T_.lock_in);
  lk.classList.toggle('on', ADMIN);
  $('#foot').innerHTML = esc(T_.foot1)+'<br>'+esc(T_.foot2);
  const nav=$('#nav');
  nav.innerHTML = ORDER.map(k=>'<option value="'+k+'">'+esc(T_.nav[k])+'</option>').join('');
  nav.value = current;
  const m=CAT.meta;
  $('#teaser').innerHTML=[
    '<b>'+compact(m.totalValue)+'</b><small>'+esc(T_.donut_center)+'</small>',
    '<b>'+nf(m.skuWithStock)+'</b><small>'+esc(T_.k_sku)+'</small>',
    '<b>'+nf(CAT.grades[0].sku)+'</b><small>'+esc(T_.f_grade)+' A</small>',
    '<b>'+m.monthsOfCover.toFixed(1)+'</b><small>'+esc(T_.k_cover)+'</small>'
  ].map(x=>'<div>'+x+'</div>').join('');
}
function setLang(v){
  L=v; try{ localStorage.setItem('sv_lang',v); }catch(e){}
  document.documentElement.lang = v;
  paintChrome();
  if(!$('#app').hidden) show(current);
}
$('#lockBtn').addEventListener('click',()=>{
  if (ADMIN){ setAdmin(false); toast(t().ad_out); if(!$('#app').hidden) show(current); return; }
  show('update'); $('#nav').value='update';
  setTimeout(()=>{ const i=document.getElementById('adPin'); if(i) i.focus(); }, 60);
});
$('#langBtn').addEventListener('click',()=>setLang(L==='th'?'en':'th'));
$('#gateLang').addEventListener('click',()=>setLang(L==='th'?'en':'th'));
$('#nav').addEventListener('change',e=>show(e.target.value));
function applyTheme(v){
  if(v) document.documentElement.setAttribute('data-theme',v);
  else document.documentElement.removeAttribute('data-theme');
  if(!$('#app').hidden) show(current);
}
$('#themeBtn').addEventListener('click',()=>{
  const now=document.documentElement.getAttribute('data-theme');
  const dark=now?now==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const nx=dark?'light':'dark'; applyTheme(nx);
  try{ localStorage.setItem('sv_theme',nx); }catch(e){}
});
document.addEventListener('keydown',e=>{
  if (e.key!=='Escape') return;
  const c=document.getElementById('cam'), pk=document.getElementById('picker');
  if (c && !c.hidden) closeCam(); else if (pk && !pk.hidden) closePicker();
});
try{ const th=localStorage.getItem('sv_theme'); if(th) applyTheme(th); }catch(e){}
try{ const v=localStorage.getItem('sv_view'); if(v&&VIEWS[v]) current=v; }catch(e){}
paintChrome();
$('#enterBtn').addEventListener('click',()=>{
  $('#gate').hidden=true; $('#app').hidden=false;
  $('#nav').value=current; show(current); scrollTo(0,0);
});
})();
